<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NET JRF Cat Academy — Prof. Whiskers Study System</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-primary: #FDFBF7;
      --bg-secondary: #F4EFE6;
      --bg-card: #FFFFFF;
      --text-main: #2D241E;
      --text-muted: #6E6259;
      --accent-amber: #D97706;
      --accent-amber-light: #FEF3C7;
      --accent-purple: #7C3AED;
      --accent-purple-light: #F3E8FF;
      --accent-rose: #E11D48;
      --accent-rose-light: #FFE4E6;
      --accent-green: #059669;
      --accent-green-light: #D1FAE5;
      --border-color: #E5DECF;
      --shadow-sm: 0 2px 4px rgba(45, 36, 30, 0.05);
      --shadow-md: 0 4px 12px rgba(45, 36, 30, 0.08);
      --shadow-lg: 0 10px 25px rgba(45, 36, 30, 0.12);
      --font-serif: 'Lora', Georgia, serif;
      --font-title: 'Cinzel', serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header & Navigation */
    header {
      background: var(--bg-card);
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-main);
    }
    .logo-badge {
      background: var(--accent-amber-light);
      color: var(--accent-amber);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      border: 2px solid var(--accent-amber);
    }
    .logo-text h1 {
      font-family: var(--font-title);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .logo-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    nav {
      display: flex;
      gap: 0.4rem;
      background: var(--bg-secondary);
      padding: 0.3rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      max-width: 100%;
    }
    .nav-btn {
      background: transparent;
      border: none;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }
    .nav-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.5);
    }
    .nav-btn.active {
      background: var(--bg-card);
      color: var(--accent-amber);
      box-shadow: var(--shadow-sm);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .app-section { display: none; }
    .app-section.active { display: block; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.8rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    /* Academic Notes Reader Typography */
    .notes-article {
      font-family: var(--font-serif);
      font-size: 1.08rem;
      line-height: 1.8;
      color: #241D18;
    }
    .notes-article h2 {
      font-family: var(--font-title);
      font-size: 1.8rem;
      color: var(--text-main);
      border-bottom: 2px solid var(--accent-amber);
      padding-bottom: 0.4rem;
      margin: 1.8rem 0 1rem 0;
    }
    .notes-article h3 {
      font-family: var(--font-sans);
      font-size: 1.3rem;
      color: var(--accent-purple);
      margin: 1.4rem 0 0.8rem 0;
      font-weight: 700;
    }
    .notes-article h4 {
      font-family: var(--font-sans);
      font-size: 1.1rem;
      color: var(--accent-amber);
      margin: 1.2rem 0 0.6rem 0;
      font-weight: 700;
    }
    .notes-article p {
      margin-bottom: 1.2rem;
    }
    .notes-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-family: var(--font-sans);
      font-size: 0.9rem;
    }
    .notes-table th, .notes-table td {
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      text-align: left;
    }
    .notes-table th {
      background: var(--bg-secondary);
      font-family: var(--font-title);
      color: var(--text-main);
    }
    .callout-box {
      background: var(--accent-amber-light);
      border-left: 4px solid var(--accent-amber);
      padding: 1rem 1.2rem;
      border-radius: 0 12px 12px 0;
      margin: 1.5rem 0;
      font-family: var(--font-sans);
      font-size: 0.95rem;
    }
    .callout-box.purple {
      background: var(--accent-purple-light);
      border-left-color: var(--accent-purple);
    }

    /* Stepper & Auto-Flow Navigation */
    .autoflow-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-secondary);
      padding: 1rem 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .stepper {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .step-pill {
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
    }
    .step-pill.active {
      background: var(--accent-amber);
      color: white;
      border-color: var(--accent-amber);
    }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary { background: var(--accent-amber); color: white; }
    .btn-primary:hover { background: #b45309; }
    .btn-secondary { background: var(--bg-secondary); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: #e8e1d3; }

    /* MCQ / PYQ Styling */
    .mcq-card {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      background: var(--bg-card);
    }
    .mcq-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }
    .badge-pyq { background: var(--accent-purple-light); color: var(--accent-purple); }
    .badge-mcq { background: var(--accent-amber-light); color: var(--accent-amber); }
    .mcq-options { display: flex; flex-direction: column; gap: 0.5rem; margin: 1rem 0; }
    .option-btn {
      text-align: left;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .option-btn:hover { background: var(--bg-secondary); }
    .option-btn.correct { background: var(--accent-green-light) !important; border-color: var(--accent-green) !important; color: var(--accent-green) !important; font-weight: 700; }
    .option-btn.incorrect { background: var(--accent-rose-light) !important; border-color: var(--accent-rose) !important; color: var(--accent-rose) !important; }
